name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          ini-values: zend.assertions=1, error_reporting=E_ALL, display_errors=On
          tools: composer:v2
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Check that every version location agrees
        run: bash scripts/release-version.sh check "$(sed -n "s/.*public const SDK = '\([0-9.]*\)'.*/\1/p" src/Version.php)"
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint every PHP file
        run: |
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
            count=$((count + 1))
          done < <(find src tests examples -name '*.php' -print0)
          echo "linted ${count} files"
          test "${count}" -gt 100
      - name: Strict PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr
      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: PHPUnit
        run: vendor/bin/phpunit
  install:
    name: Install into a clean project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: curl, json
          tools: composer:v2
          coverage: none
      - name: Require the package from this checkout and use it
        run: bash tests/clean-install.sh "$PWD"
