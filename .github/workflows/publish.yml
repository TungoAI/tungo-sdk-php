# Generated by tungo-sdkgen. Do not edit.
#
# Publishes tungo/sdk (Packagist) when a tag vX.Y.Z is pushed. To retry a failed
# release, run this workflow manually FROM THE TAG (gh workflow run publish.yml --ref vX.Y.Z).
# The job fails when a credential is missing or the registry does not serve the new version.
#
# Repository setup:
#   - environment "release" (add required reviewers there to gate publishing)
#   - the package tungo/sdk submitted once on packagist.org
#   - secrets PACKAGIST_USERNAME and PACKAGIST_TOKEN (API token of the maintainer account)
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set and verify the version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a release tag vX.Y.Z (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}')."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-version.sh set "${version}"
          bash scripts/release-version.sh check-release "${version}"
          if ! git diff --exit-code; then
            echo "::error::The commit tagged ${GITHUB_REF_NAME} carries a different version. Bump VERSION in tungo-sdkgen, regenerate, commit, and tag the new commit with a new version."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Packagist
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Require registry credentials
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          missing=0
          for name in PACKAGIST_USERNAME PACKAGIST_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret ${name} is not set."
              missing=1
            fi
          done
          exit "${missing}"
      - name: Ask Packagist to read the new tag
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -fsS -X POST "https://packagist.org/api/update-package" \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/TungoAI/tungo-sdk-php"}}'
      - name: Wait until Packagist serves the new version
        env:
          URL: https://repo.packagist.org/p2/tungo/sdk.json
          PATTERN: '"version":"v?${{ needs.preflight.outputs.version }}"'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -A tungo-sdk-release "${URL}" | grep -qE "${PATTERN}"; then
              echo "${URL} is available."
              exit 0
            fi
            echo "Not available yet (attempt ${attempt})."
            sleep 10
          done
          echo "::error::Packagist did not serve version ${VERSION} within 10 minutes: ${URL}"
          exit 1

  github-release:
    name: GitHub release
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release from the CHANGELOG entry
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { printing = 1; next }
            /^## \[/ { printing = 0 }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [[ ! -s "${RUNNER_TEMP}/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no notes for ${VERSION}."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
